spring.application.name=auth

server.port=3000
server.address=0.0.0.0

# ===== PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/users
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== Hibernate/JPA =====
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# ===== Redis =====
spring.data.redis.host=${REDIS_HOST:auth-redis-srv}
spring.data.redis.port=${REDIS_PORT:6379}

# ===== JWT =====
microservice-demo.auth.jwt.secret=${JWT_SECRET}
# アクセストークン有効期限: 15分 (ミリ秒)
microservice-demo.auth.jwt.access-token-expiration=900000
# リフレッシュトークン有効期限: 7日 (ミリ秒)
microservice-demo.auth.jwt.refresh-token-expiration=604800000
# リフレッシュトークンCookie名
microservice-demo.auth.jwt.refresh-cookie-name=REFRESH_TOKEN
# Cookieの適用パス
microservice-demo.auth.jwt.cookie-path=/api
