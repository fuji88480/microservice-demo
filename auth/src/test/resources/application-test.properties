# ===== DB =====
# PostgreSQLの接続情報はTestcontainersが @DynamicPropertySource で動的に設定する
# Hibernateが起動時にテーブルを自動作成し、終了時に削除
spring.jpa.hibernate.ddl-auto=create-drop

