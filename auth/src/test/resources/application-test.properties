microservice-demo.auth.jwt.secret=dGhpc0lzQVRlc3RTZWNyZXRLZXlGb3JKV1RUZXN0aW5nT25seURvTm90VXNlSW5Qcm9kMTIz
microservice-demo.auth.jwt.access-token-expiration=900000
